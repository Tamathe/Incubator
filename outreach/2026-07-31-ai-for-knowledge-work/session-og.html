<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copilot Cowork for knowledge work</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #08090b;
      }

      body {
        color: #f7f8fb;
        font-family: Impact, "Arial Narrow", Arial, sans-serif;
      }

      main {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 350px;
        gap: 58px;
        width: 100%;
        height: 100%;
        padding: 50px 58px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          radial-gradient(circle at 88% 18%, rgba(91, 140, 255, 0.2), transparent 34%),
          #08090b;
        background-size: 40px 40px, 40px 40px, auto, auto;
      }

      main::before {
        position: absolute;
        inset: 0 0 auto;
        height: 10px;
        background: #5b8cff;
        content: "";
      }

      .left {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 0;
      }

      .logo {
        width: 235px;
        height: auto;
      }

      h1 {
        max-width: 750px;
        margin: 30px 0 0;
        font-size: 84px;
        font-weight: 400;
        line-height: 0.93;
        letter-spacing: 0.006em;
        text-transform: uppercase;
      }

      h1 span {
        display: block;
      }

      h1 em {
        color: #5b8cff;
        font-style: normal;
      }

      .meta {
        display: flex;
        gap: 20px;
        align-items: center;
        margin: 28px 0 0;
        color: #c9d8ff;
        font-size: 21px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .meta span + span::before {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin: 0 20px 3px 0;
        background: #5b8cff;
        content: "";
      }

      .right {
        display: grid;
        grid-template-rows: 1fr 1fr;
        gap: 18px;
        align-self: center;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 218px;
        padding: 28px;
        border: 1px solid #344054;
        background: rgba(15, 17, 22, 0.95);
      }

      .card::before {
        position: absolute;
        top: -1px;
        left: -1px;
        width: 78px;
        height: 5px;
        background: #5b8cff;
        content: "";
      }

      .presenter,
      .detail {
        margin: 0;
        color: #9abaff;
        font-size: 16px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .card h2 {
        max-width: 8ch;
        margin: 0;
        font-size: 40px;
        font-weight: 400;
        line-height: 0.98;
        text-transform: uppercase;
      }

      .detail {
        color: #9ca6b8;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main role="img" aria-label="Copilot Cowork for knowledge work with Andrew Peng and Tama Thé">
      <section class="left">
        <img class="logo" src="../../public/ai-at-uk-incubator-logo.png" alt="AI at UK Incubator" />
        <div>
          <h1>
            <span>Copilot Cowork</span>
            <span><em>for</em> Knowledge Work</span>
          </h1>
          <div class="meta">
            <span>July 31</span>
            <span>Noon ET</span>
            <span>Microsoft Teams</span>
          </div>
        </div>
      </section>

      <section class="right" aria-label="Presentations">
        <article class="card">
          <p class="presenter">Andrew Peng</p>
          <h2>Research project</h2>
          <p class="detail">Instructions · Sources · Cowork</p>
        </article>
        <article class="card">
          <p class="presenter">Tama Thé</p>
          <h2>Ongoing project</h2>
          <p class="detail">Files · Next step · Drafts</p>
        </article>
      </section>
    </main>
  </body>
</html>
